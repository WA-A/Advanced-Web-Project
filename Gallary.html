<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="./CssFiles/Styles-Gallary.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <nav>
        <ul>
          <li><a href="Dashboard.html">Overview</a></li>
          <li><a href="VillageManagement.html">Village Management</a></li>
          <li><a href="Chat.html">Chat</a></li>
          <li><a href="Gallary.html" class="active">Gallery</a></li>
        </ul>
      </nav>
      <div class="admin">
        <img src="./Image/Profile.png" alt="Admin Avatar" class="avatar">
        <div class="admin-info">
          <span id="adminName">Admin Name</span>
          <a href="#" id="logoutButton">Logout</a>
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="Images">
        <!-- Button to open modal -->
        <div class="button">
          <button id="openModalButton">Add New Image</button>
        </div>

        <!-- Modal for adding new image -->
        <div id="addimageModal" class="modal">
          <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Add New Image</h2>
            <form id="addImageForm">
              <label for="imageFile">Select Image</label>
              <input type="file" id="imageFile" accept="image/*" required />

              <label for="description">Description</label>
              <textarea id="description" rows="3" required></textarea>

              <button type="submit">Add Image</button>
            </form>
          </div>
        </div>

        <!-- Image List -->
        <div class="ListImage">
          <div class="Image1">
            <img src="./Image/Quds.jpg" alt="Image of Quds" class="avatar">
            <p>The image Quds</p>
          </div>
          <div class="Image1">
            <img src="./Image/ibrahami.jpg" alt="Image of Ibrahimi Mosque" class="avatar">
            <p>The image Ibrahimi Mosque</p>
          </div>
          <div class="Image1">
            <img src="./Image/ramallaha.jpg" alt="Image of Ramallah" class="avatar">
            <p>The image Ramallah</p>
          </div>
          <div class="Image1">
            <img src="./Image/hefa.jpg" alt="Image of Haifa" class="avatar">
            <p>The image Haifa</p>
          </div>
          <div class="Image1">
            <img src="./Image/jenin.jpg" alt="Image of Jenin" class="avatar">
            <p>The image Jenin</p>
          </div>
          <div class="Image1">
            <img src="./Image/jercio.jpg" alt="Image of Jericho" class="avatar">
            <p>The image Jericho</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./JsFiles/Styles-Gallary.js"></script>
</body>
</html>
