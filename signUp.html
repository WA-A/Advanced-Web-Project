<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up Page</title>
    <link rel="stylesheet" href="./CssFiles/Styles-Signup.css" />
  </head>
  <body>
    <div class="signup-container">
      <form id="signup-form">
        <h2>Sign Up</h2>
        <div class="full-name">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
          />
        </div>
        <div class="username">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
          />
        </div>
        <div class="password">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          />
        </div>
        <button type="submit">Sign Up</button>
        <h3 class="have-account">
          Already have an account? <a href="Login.html">Login</a>
        </h3>
      </form>
    </div>
    <script src="./JsFiles/Login&SignUp.js"></script>
  </body>
</html>
